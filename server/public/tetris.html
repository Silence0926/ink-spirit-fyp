<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee9dc"><title>墨方落影 · Tetris | Ink Spirit</title><link rel="stylesheet" href="styles/ink-world.css"><link rel="stylesheet" href="styles/tetris.css"><script defer src="scripts/tetris.js"></script></head>
<body class="tetris-page"><header class="games-header"><a href="index.html">墨灵 · INK SPIRIT</a><a href="games.html">返回小游园</a></header><main class="tetris-shell"><p class="eyebrow">FALLING INK · 墨落成形</p><h1>墨方落影 <em>· Tetris</em></h1><p class="games-lead">让方块落入恰当的位置，填满横行即可消去。方寸之间，落笔有序。</p>
<section class="tetris-stats"><div><small>分数 SCORE</small><strong id="tetris-score">0</strong></div><div><small>最高纪录 BEST</small><strong id="tetris-best">0</strong></div><div><small>等级 LEVEL</small><strong id="tetris-level">1</strong></div><div><small>消行 LINES</small><strong id="tetris-lines">0</strong></div></section>
