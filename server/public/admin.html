<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Studio | Ink Spirit</title><link rel="stylesheet" href="styles/styles.css"><link rel="stylesheet" href="styles/admin.css"></head><body><div id="navbar"></div><main class="page-shell"><header class="page-heading"><p class="eyebrow">INK SPIRIT · CONTROL ROOM</p><h1>管理中枢 · Admin Studio</h1><p>Manage products, stock, customer orders and account roles.</p></header><section class="admin-tabs"><button data-tab="products" class="active">Products</button><button data-tab="orders">Orders</button><button data-tab="users">Users & Roles</button></section><section id="admin-products" class="admin-panel"><div class="admin-toolbar"><h2>Product Catalogue</h2><button id="new-product">+ New Product</button></div><form id="product-form" class="admin-form" hidden><input type="hidden" id="product-id"><label>Name<input id="product-name" required maxlength="160"></label><label>Category<input id="product-category" required maxlength="160"></label><label>Description<textarea id="product-description" required maxlength="1200"></textarea></label><label>Price (MYR)<input id="product-price" type="number" min="0" step=".01" required></label><label>Stock<input id="product-stock" type="number" min="0" step="1" required></label><label>Image path<input id="product-image" required></label><label class="inline-check"><input id="product-active" type="checkbox" checked> Active</label><div><button type="submit">Save Product</button><button type="button" id="cancel-product">Cancel</button></div></form><div id="admin-product-list" class="admin-list">Loading…</div></section><section id="admin-orders" class="admin-panel" hidden><h2>Customer Orders</h2><div id="admin-order-list" class="admin-list">Loading…</div></section><section id="admin-users" class="admin-panel" hidden><h2>Accounts & Roles</h2><p class="form-note">Only administrators can change account roles.</p><div id="admin-user-list" class="admin-list">Loading…</div></section></main><div id="footer"></div><script src="scripts/auth.js"></script><script src="scripts/include.js"></script><script src="scripts/admin.js"></script></body></html>
