<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee9dc"><title>数独清心 · Sudoku | Ink Spirit</title><link rel="stylesheet" href="styles/ink-world.css"><link rel="stylesheet" href="styles/games.css"><script defer src="scripts/sudoku.js"></script></head><body class="puzzle-page"><header class="games-header"><a href="index.html">墨灵 · INK SPIRIT</a><a href="games.html">返回小游园</a></header><main class="sudoku-shell"><p class="eyebrow">THE NINE PALACES · 九宫清心</p><h1>数独清心 <em>· Sudoku</em></h1><p class="games-lead">让每个数字各安其位。每一行、每一列与每个九宫格，都必须包含 1 至 9，且不可重复。</p><section class="sudoku-toolbar"><label>难度<select id="difficulty"><option value="easy">初阶 · Easy</option><option value="medium" selected>进阶 · Medium</option><option value="hard">静心 · Hard</option></select></label><button id="new-puzzle" type="button">新开一局</button><div class="sudoku-stat"><small>用时</small><strong id="timer">00:00</strong></div><div class="sudoku-stat"><small>错误</small><strong id="mistakes">0</strong></div></section><div id="sudoku-status" class="puzzle-status" aria-live="polite">选择空格，再输入数字；也可使用键盘 1–9。</div><div class="sudoku-layout"><div id="sudoku-board" class="sudoku-board" role="grid" aria-label="数独棋盘"></div><aside class="sudoku-side"><div class="sudoku-number-pad" aria-label="数字输入"><button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button><button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button><button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button></div><button id="notes-mode" class="sudoku-action" type="button" aria-pressed="false">候选笔记：关闭</button><button id="erase" class="sudoku-action" type="button">擦除所选格</button><button id="check" class="sudoku-action" type="button">检查当前棋盘</button><p class="sudoku-note">笔记模式可在空格中记录候选数字。选中数字后，再点同一数字可取消。</p></aside></div><p class="puzzle-back"><a href="games.html">← 返回灵境小游园</a></p></main><footer><span class="footer-seal">墨</span><span>墨灵 · INK SPIRIT</span><span>一格一数 · 心静自明</span></footer></body></html>
