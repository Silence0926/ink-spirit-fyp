name: Export Ink Spirit soundtrack

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-soundtrack.yml"
      - "server/public/audio/ink-spirit-original.wav"

permissions:
  contents: write

jobs:
  export-mp3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Export MP3
        run: |
          ffmpeg -hide_banner -y -i server/public/audio/ink-spirit-original.wav -codec:a libmp3lame -b:a 128k -ar 22050 server/public/audio/ink-spirit-original.mp3
      - name: Commit MP3 asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/public/audio/ink-spirit-original.mp3
          if git diff --cached --quiet; then
            echo "MP3 is already up to date."
          else
            git commit -m "Add MP3 export of original Ink Spirit soundtrack"
            git push
          fi
